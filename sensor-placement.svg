<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" font-family="Arial,sans-serif"><rect width="1100" height="730" fill="#fafafa"/><text x="30" y="40" font-size="26" font-weight="bold">Sensor placement + wire colours</text><text x="30" y="70" font-size="17">Placement sketch — NOT to scale. Use your real case to measure the wire route.</text><text x="30" y="115" font-size="22" font-weight="bold">1. SIDE VIEW: keyboard in normal use</text><circle cx="240" cy="205" r="70" fill="#b9a3df" stroke="#65499b" stroke-width="3"/><text x="217" y="210" font-size="20">BALL</text><path d="M145 210 Q145 295 240 295 Q335 295 335 210" fill="none" stroke="#999" stroke-width="10"/><rect x="175" y="285" width="12" height="40" fill="#999"/><rect x="293" y="285" width="12" height="40" fill="#999"/><rect x="210" y="300" width="60" height="25" fill="#d6edf5" stroke="#27849a"/><rect x="155" y="325" width="170" height="9" fill="#303844"/><path d="M175 334v22 M185 334v22 M300 334v22" stroke="#888" stroke-width="4"/><text x="365" y="270" font-size="18">Clear lens faces UP toward the ball.</text><text x="365" y="300" font-size="18">Round board sits UNDER the cup, against the posts.</text><text x="365" y="330" font-size="18">Metal pins face DOWN toward the removable bottom plate.</text><text x="365" y="360" font-size="18" fill="#ad3434">Hold temporarily. No glue until tracking works.</text><text x="30" y="410" font-size="22" font-weight="bold">2. CASE UPSIDE DOWN: the side you solder</text><circle cx="175" cy="520" r="65" fill="#303844"/><rect x="150" y="485" width="50" height="65" fill="#626977"/><text x="110" y="615" font-size="17">Sensor pin side</text><rect x="460" y="460" width="110" height="135" rx="8" fill="#315aa6"/><rect x="493" y="448" width="44" height="16" fill="#aaa"/><text x="476" y="520" font-size="18" fill="white">RIGHT</text><text x="470" y="545" font-size="18" fill="white">controller</text><path d="M220 530 C280 530 285 590 330 590 S380 500 405 525 S430 550 460 540" fill="none" stroke="#25846e" stroke-width="8"/><text x="250" y="480" font-size="16">Six wires routed along the case wall</text><text x="250" y="635" font-size="16">Leave a loose loop, not a tight straight line.</text><text x="650" y="430" font-size="20" font-weight="bold">Use these colours (if you have them)</text><g font-size="18"><text x="650" y="468" fill="#c62828">RED: VDD → VCC</text><text x="650" y="502">BLACK: GND → GND</text><text x="650" y="536" fill="#a87b00">YELLOW: SCLK → 008</text><text x="650" y="570" fill="#1769aa">BLUE: SDIO → 011</text><text x="650" y="604" fill="#278344">GREEN: NCS → 104</text><text x="650" y="638" fill="#873c9b">PURPLE: MOT → 006</text></g><text x="30" y="686" font-size="17">Length: follow the real route with an uncut wire, add about 2–3 cm of slack, then cut. Keep clear of screws.</text><text x="30" y="712" font-size="16" fill="#ad3434">All power disconnected while soldering. Do not let wires cross the lens, bearing pockets or bottom-plate screw seats.</text></svg>