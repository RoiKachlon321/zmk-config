<text x="535" y="650" font-size="12" fill="#d00" text-anchor="start">band leg soldered onto key 2's pin 2</text>
<text x="40" y="820" font-size="14" fill="#333" text-anchor="start">Key 2 still types, but the row now touches key 2's switch directly, so key 2's diode does nothing.</text>
<text x="40" y="842" font-size="14" fill="#333" text-anchor="start">Pressing several keys at once can then produce wrong letters (ghosting). Band legs only touch band legs or blue.</text>
