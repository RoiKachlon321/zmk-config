<text x="40" y="410" font-size="14" fill="#333" text-anchor="start">Each colour = one diode, from its switch pin to where it's soldered onto the next diode's leg.</text>
<text x="40" y="430" font-size="14" fill="#333" text-anchor="start">The bent band legs ARE the row. No blue between keys; blue only from the last key to the controller.</text>
<line x1="20" y1="470" x2="1040" y2="470" stroke="#ccc" stroke-width="2"/>
<text x="40" y="520" font-size="18" fill="#d00" text-anchor="start">❌ WRONG: band leg → next key's switch pin</text>
