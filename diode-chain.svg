<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="900" font-family="Helvetica">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" font-size="22" fill="#000" text-anchor="start">Skip the blue: join the diodes directly (one row, seen from below)</text>
<text x="40" y="66" font-size="14" fill="#333" text-anchor="start">Each diode lies sideways from pin 2 toward the next key. After the band, its leg kinks down a few mm</text>
<text x="40" y="86" font-size="14" fill="#333" text-anchor="start">and runs on to the NEXT key's kink. The kink keeps the row under the next diode instead of touching it.</text>
<text x="40" y="130" font-size="18" fill="#080" text-anchor="start">✅ RIGHT: band leg → next key's band leg</text>
